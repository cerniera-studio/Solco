name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Compiler and Gradle errors as annotations, readable without the full log
          grep -E "^e: |What went wrong|^> [^T]|Could not|rror:" build.log | grep -v "^> Task" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Solco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Solco
          path: Solco.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Solco build ${{ github.run_number }}
          # Builds from a branch are kept as pre-releases (for their screenshots), so the latest release is always main's
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: Solco.apk

  # Installs on a clean emulator, opens Settings and the wallpaper preview, touches the grain,
  # tries Tronco and the main screen's shape, and fails the run if the app crashed.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Solco

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/emulator_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            shot-*.png
            app-log.txt
            shapes.txt

      - name: Attach screenshots to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            shot-*.png
            app-log.txt
            shapes.txt
